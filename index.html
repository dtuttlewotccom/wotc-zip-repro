<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>WOTC ZIP code repro</title>

  <!-- exact stylesheets the real f8850 form loads (copied from public/plugins/f8850/css/) -->
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <link href="./f8850/bootstrap.min.css" rel="stylesheet" />
  <link href="./f8850/main.css" rel="stylesheet" />

  <style>
    /* Demographics.vue \3c style lang="scss" scoped> — nested SCSS compiled & de-scoped */
    .form-group { margin-bottom: 0.5rem !important; }
    .form-group label { height: auto; }
    .form-group select.form-control[id=state] { padding: .375rem; }
    .form-group .form-control { height: 32px; padding: .175rem .175rem; }
    .form-group .input-group .form-control { height: 32px !important; padding-left: 24px; }
    .input-group .form-control { height: 32px !important; padding-left: 24px; }
    .input-group .input-group-text { padding-left: .175rem; padding-top: 0; padding-bottom: 0; height: 32px; }
    label { margin-bottom: .1rem; }
    label .red { padding-left: .5rem; display: contents; }
    h6 { margin: 2rem 0; }

    /* harness chrome only — kept outside .form-group so it can't affect the field */
    .harness { padding: 1.25rem; max-width: 900px; margin: 0 auto; }
    .harness .lead { font-size: .9rem; color: #555; }
    .cap { font-size: 12px; font-weight: 700; letter-spacing: .04em; margin: 0 0 .3rem; }
    .cap-cur { color: #b03030; }
    .cap-fix { color: #1a6b34; }
    .dbg { background: #fff; border: 1px solid #d5d9e0; border-radius: 6px; padding: .6rem .8rem; font-size: 12px; margin-top: .6rem; }
    .dbg code { display: block; white-space: pre-wrap; word-break: break-all; margin: .1rem 0 .45rem; }
    .inject { margin-top: 1.25rem; }
    .inject h2 { font-size: .9rem; margin: 0 0 .35rem; }
    .inject button { margin: .2rem .3rem .2rem 0; }
  </style>
  <script type="module" crossorigin src="./assets/app.js"></script>
</head>
<body>
  <div class="harness"><div id="app"></div></div>
</body>
</html>
